name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Lint first: cheapest step, and it catches the temporal-dead-zone class
      # (a const referenced above its declaration) in seconds.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The one the unit suite is structurally blind to: renders every screen,
      # every tab, and the modals, and fails on a throw.
      - name: Render smoke test
        run: npm run smoke

      - name: Build
        run: npm run build
