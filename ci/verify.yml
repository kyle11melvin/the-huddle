# ⚠️  NOT ACTIVE YET — this file has to move to .github/workflows/ci.yml to run.
#
# It is parked here because GitHub rejects any push touching .github/workflows/
# from an OAuth app without the `workflow` scope, which the gh CLI token used
# here does not have. No push from this side can land it. Parked VISIBLE rather
# than hidden behind a .gitignore — the first attempt buried it, which made the
# work look done when it wasn't.
#
# Two ways to activate, either is fine:
#
#   A) Browser, fastest, no re-auth. Open:
#      https://github.com/kyle11melvin/the-huddle/new/main?filename=.github/workflows/ci.yml
#      paste everything BELOW this header, commit to main.
#
#   B) Grant the scope once, then move it:
#      gh auth refresh -h github.com -s workflow
#      mkdir -p .github/workflows && git mv ci/verify.yml .github/workflows/ci.yml
#      # delete this header, then:
#      git commit -am "CI: run the verify gate on every push" && git push
#
# Once it's live, `npm run verify` runs on every push instead of only when
# someone remembers — which is how the Start/Sit crash reached production.
# ---------------------------------------------------------------------------

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Lint first: cheapest step, and it catches the temporal-dead-zone class
      # (a const referenced above its declaration) in seconds.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The one the unit suite is structurally blind to: renders every screen,
      # every tab, and the modals, and fails on a throw.
      - name: Render smoke test
        run: npm run smoke

      - name: Build
        run: npm run build
